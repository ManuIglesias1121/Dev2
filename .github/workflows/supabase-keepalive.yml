name: Supabase Keep-Alive

# Mantiene activo el proyecto Supabase (plan Free se pausa tras 7 dias sin actividad).
# Hace una consulta real a la DB cada dia para resetear el contador de inactividad.

on:
  schedule:
    # Todos los dias a las 12:00 UTC (~09:00 ART). Cron en UTC.
    - cron: '0 12 * * *'
  workflow_dispatch: {} # permite dispararlo a mano desde la pestania Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pingeando Supabase para mantener el proyecto activo..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "OK - Supabase respondio, proyecto activo."
          else
            echo "ERROR - respuesta inesperada ($HTTP_CODE)"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
